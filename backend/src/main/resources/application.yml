spring:
  application:
    name: career-copilot
  # Local development reads secrets from backend/.env (gitignored). Production uses real env vars.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  # Render terminates TLS at a proxy; trust X-Forwarded-For so rate limiting sees the real client IP.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry: ${JWT_EXPIRY:PT1H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    max-requests: ${AUTH_RATE_LIMIT_MAX:10}
    window: ${AUTH_RATE_LIMIT_WINDOW:PT1M}
  storage:
    dir: ${RESUME_STORAGE_DIR:./storage}
  scraper:
    # Off by default so local runs and tests never call the public job board APIs.
    enabled: ${SCRAPER_ENABLED:false}
    cron: ${SCRAPER_CRON:0 0 * * * *}
    # Comma separated source:token pairs, for example greenhouse:stripe,lever:palantir
    boards: ${SCRAPER_BOARDS:}
  agent:
    # Hourly draft agent: writes application drafts (never submits) for new postings scoring at least min-score.
    enabled: ${AGENT_ENABLED:false}
    min-score: ${AGENT_MIN_SCORE:70}
    cron: ${AGENT_CRON:0 15 * * * *}
  locations:
    # Re-derives job_locations from each stored free-text location at startup (idempotent, deletes no jobs).
    reparse-on-startup: ${LOCATIONS_REPARSE_ON_STARTUP:true}
  mail:
    # All optional: without the four Google/key values the mailbox feature reports configured=false.
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    google-redirect-uri: ${GOOGLE_REDIRECT_URI:}
    # base64 of 32 random bytes, for example: openssl rand -base64 32
    token-key: ${MAIL_TOKEN_KEY:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    sync-enabled: ${MAIL_SYNC_ENABLED:false}
    sync-cron: ${MAIL_SYNC_CRON:0 0 * * * *}
    reminder-days: ${REMINDER_DAYS:7}
    reminders-enabled: ${REMINDERS_ENABLED:true}
    reminder-cron: ${REMINDER_CRON:0 30 * * * *}
